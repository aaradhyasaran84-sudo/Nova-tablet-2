name: Build NOVA Tablet APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept licenses
        run: "yes | sdkmanager --licenses >/dev/null || true"

      - name: Install SDK
        run: 'sdkmanager "platforms;android-37" "build-tools;36.0.0" "platform-tools"'

      - name: Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Unpack source
        run: "rm -rf nova-build && mkdir -p nova-build && unzip -q NOVA_Tablet_v0.1_Source.zip -d nova-build"

      - name: Build APK
        working-directory: nova-build/NOVA_Tablet_v0.1
        run: "gradle :app:assembleDebug --stacktrace"

      - name: Rename APK
        run: "cp nova-build/NOVA_Tablet_v0.1/app/build/outputs/apk/debug/app-debug.apk NOVA-Tablet-v0.1.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NOVA-Tablet-v0.1-APK
          path: NOVA-Tablet-v0.1.apk
          if-no-files-found: error
