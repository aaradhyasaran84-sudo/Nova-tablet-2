name: Build NOVA Tablet APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Check NOVA source
        run: test -f NOVA_Tablet_v0.1_Source.zip

      - name: Unpack NOVA
        run: mkdir -p nova-build && unzip -q NOVA_Tablet_v0.1_Source.zip -d nova-build

      - name: Build NOVA APK
        working-directory: nova-build/NOVA_Tablet_v0.1
        run: gradle :app:assembleDebug --stacktrace

      - name: Copy APK
        run: cp nova-build/NOVA_Tablet_v0.1/app/build/outputs/apk/debug/app-debug.apk NOVA-Tablet-v0.1.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NOVA-Tablet-v0.1-APK
          path: NOVA-Tablet-v0.1.apk
          if-no-files-found: error
