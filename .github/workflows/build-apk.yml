name: Build NOVA Tablet APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      NOVA_SOURCE_ZIP_B64: '
      - name: Build APK
        working-directory: nova-build/NOVA_Tablet_v0.1
        run: "gradle :app:assembleDebug --stacktrace"

      - name: Rename APK
        run: "cp nova-build/NOVA_Tablet_v0.1/app/build/outputs/apk/debug/app-debug.apk NOVA-Tablet-v0.1.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NOVA-Tablet-v0.1-APK
          path: NOVA-Tablet-v0.1.apk
          if-no-files-found: error
